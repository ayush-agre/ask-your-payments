# ==============================================================================
# Ask-Your-Payments Orchestration: Production Docker Compose
# Team CrackerX · FinOps Hackathon 2026
# ==============================================================================
# Single-command launch:
#   docker-compose up --build -d
# Teardown:
#   docker-compose down
# Logs:
#   docker-compose logs -f
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Core API & WebSocket Gateway
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ask-your-payments-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finops-network

  # ----------------------------------------------------------------------------
  # 2. Asynchronous Transactional Outbox & APIMatic Execution Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ask-your-payments-worker
    command: ["python", "execution_worker.py"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finops-network

  # ----------------------------------------------------------------------------
  # 3. Next.js Financial Investigation Studio & AG Grid Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/events
    container_name: ask-your-payments-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/events
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finops-network

networks:
  finops-network:
    driver: bridge
